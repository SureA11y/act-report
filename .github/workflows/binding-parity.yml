name: Binding parity

# The browser report (act-report-browser.jsonld) says how the engine behaves
# in Chromium, "as the browser bindings run it". This checks that claim: each
# binding, at the version npm serves, scans every ACT test case through its
# public API, and must give the same outcome on every one as the engine's own
# Chromium runner, in the same Chromium and on the same page bytes. A
# difference fails the binding's job and lists the test cases.
#
# The engine's runner scans first, in a job of its own, and fetches every file
# from w3.org once; the binding jobs scan from its cache and fetch nothing.
# w3.org rate-limits GitHub's runners, and several jobs fetching the corpus at
# once get turned away. The cache also makes the bytes the same for every
# binding, not only the same URLs.
#
# It publishes nothing: the browser report stays what the engine's runner
# gives. A red run means the report no longer speaks for that binding.

on:
  schedule:
    # Mondays, after act-report.yml, against the same releases.
    - cron: '0 8 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/parity/**
      - .github/scripts/same-outcomes.js
      - .github/actions/released-core/**
      - .github/workflows/binding-parity.yml

permissions:
  contents: read

concurrency:
  group: binding-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: engine's runner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.engine.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the released engine
        id: engine
        uses: ./.github/actions/released-core

      # The Chromium of the engine's locked playwright, which its own runner
      # uses and every binding job is pointed at.
      - name: Install Chromium
        working-directory: core
        run: npx playwright install --with-deps chromium

      # As act-report.yml runs it, with the cache on: each file is fetched
      # once and kept, in core/.act-cache, for the binding jobs. A test case it
      # could not read (exit 2: a page that did not load in time, or one that
      # refreshes itself away before 1.15) has nothing to compare with, and is
      # left out of every comparison with a warning; a false positive (exit 1)
      # fails the run.
      - name: Scan with the engine's runner
        run: |
          status=0
          node core/scripts/act-report.js --runner=chromium --out=reference.jsonld || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning::The engine's runner could not read every test case; those it could not are left out of the comparison."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Keep the reference and the page cache
        uses: actions/upload-artifact@v7
        with:
          name: parity-reference
          path: |
            reference.jsonld
            core/.act-cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  parity:
    name: ${{ matrix.binding }}
    needs: reference
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - binding: playwright
            install: '@surea11y/playwright'
          - binding: puppeteer
            install: '@surea11y/puppeteer puppeteer'
          - binding: webdriverio
            install: '@surea11y/webdriverio webdriverio'
            chromedriver: true
          - binding: selenium
            install: '@surea11y/selenium selenium-webdriver'
            chromedriver: true
          - binding: cypress
            install: '@surea11y/cypress cypress'
    steps:
      - uses: actions/checkout@v7

      # The release the reference job scanned, not whatever npm serves by now.
      - name: Check out the released engine
        id: engine
        uses: ./.github/actions/released-core
        with:
          version: ${{ needs.reference.outputs.version }}

      - name: Install Chromium
        working-directory: core
        run: npx playwright install --with-deps chromium

      # The binding as a user installs it, beside the released engine. The
      # runner checks that it loads that engine, not another copy. Puppeteer's
      # own Chrome is not downloaded: every binding runs in the Chromium above.
      - name: Install the binding
        working-directory: core
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm install --no-save ${{ matrix.install }}
          npm ls @surea11y/${{ matrix.binding }} @surea11y/core

      # The bindings that don't launch the engine's Chromium themselves are
      # pointed at it.
      - name: Locate Chromium
        working-directory: core
        run: |
          CHROME="$(node -p "require('playwright').chromium.executablePath()")"
          echo "CHROME_BINARY=$CHROME" >> "$GITHUB_ENV"
          echo "CHROME_VERSION=$("$CHROME" --version | grep -oE '[0-9]+(\.[0-9]+){3}')" >> "$GITHUB_ENV"

      # A binding that drives Chromium through ChromeDriver needs the one of
      # the browser's exact version: Chrome for Testing publishes one for each.
      - name: Install ChromeDriver
        if: matrix.chromedriver
        run: |
          curl -fsSL -o "$RUNNER_TEMP/chromedriver.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chromedriver-linux64.zip"
          unzip -q "$RUNNER_TEMP/chromedriver.zip" -d "$RUNNER_TEMP"
          echo "CHROMEDRIVER_BINARY=$RUNNER_TEMP/chromedriver-linux64/chromedriver" >> "$GITHUB_ENV"
          echo "Chromium and ChromeDriver $CHROME_VERSION"

      # reference.jsonld, and the page cache back into core/.act-cache.
      - name: Get the reference and the page cache
        uses: actions/download-artifact@v8
        with:
          name: parity-reference

      # As a --runner-module from the engine release that has the option;
      # preloaded, replacing the engine's runner, for an earlier one. A false
      # positive (exit 1) or a test case it could not read (exit 2) is for the
      # comparison to judge against the reference; a run that wrote no report
      # fails there too.
      - name: Scan through the binding
        env:
          CORE_DIR: core
          PARITY_BINDING: ${{ matrix.binding }}
        run: |
          status=0
          if grep -q -- '--runner-module' core/scripts/act-report.js; then
            node core/scripts/act-report.js --runner=chromium \
              --runner-module=.github/parity/binding-runner.js --out=${{ matrix.binding }}.jsonld || status=$?
          else
            node -r ./.github/parity/binding-runner.js core/scripts/act-report.js \
              --runner=chromium --out=${{ matrix.binding }}.jsonld || status=$?
          fi
          if [ "$status" -gt 2 ]; then exit "$status"; fi

      - name: Compare the outcomes
        run: |
          status=0
          node .github/scripts/same-outcomes.js reference.jsonld ${{ matrix.binding }}.jsonld \
            > comparison.txt || status=$?
          cat comparison.txt
          {
            echo "### ${{ matrix.binding }} against core ${{ steps.engine.outputs.version }}"
            echo '```'
            cat comparison.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Keep the binding's report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-${{ matrix.binding }}
          path: ${{ matrix.binding }}.jsonld
          if-no-files-found: ignore

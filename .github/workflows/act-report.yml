name: ACT implementation report

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: act-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: SureA11y/core
          path: core
          fetch-depth: 0

      # W3C reads the report as a claim about a published version, so it is
      # generated from the tag of the version npm serves as latest, never from
      # core's main, whose src moves on as soon as a release is out.
      - name: Check out the released engine
        id: engine
        working-directory: core
        run: |
          VERSION="$(npm view @surea11y/core dist-tags.latest)"
          if ! git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" >/dev/null; then
            echo "::error::npm serves $VERSION as latest, but core has no v$VERSION tag"
            exit 1
          fi
          git checkout --detach "v$VERSION"
          if [ "$(node -p "require('./package.json').version")" != "$VERSION" ]; then
            echo "::error::package.json at v$VERSION does not say $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: core/package-lock.json

      - run: npm ci
        working-directory: core

      # Exits non-zero on a false positive. That is what the weekly run is for:
      # ACT keeps adding test cases, and one of them may reach a rule wrongly.
      - name: Generate the report
        run: node core/scripts/act-report.js --no-cache --out=act-report.jsonld

      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The generator stamps the run date into the report. Publish only
          # when something else changed, so the dates say when it last did.
          git show HEAD:act-report.jsonld > "$RUNNER_TEMP/published.jsonld"
          status=0
          node .github/scripts/same-report.js "$RUNNER_TEMP/published.jsonld" act-report.jsonld || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Report unchanged."
            exit 0
          elif [ "$status" -ne 1 ]; then
            exit "$status"
          fi
          git add act-report.jsonld
          CASES="$(node -p "JSON.parse(require('fs').readFileSync('act-report.jsonld','utf8'))['@graph'].filter((n) => n['@type'] === 'TestSubject').length")"
          git commit -m "Regenerate the implementation report for core ${{ steps.engine.outputs.version }}" \
                     -m "$CASES ACT test cases, no false positives."
          git push

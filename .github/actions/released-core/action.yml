name: Released engine
description: >
  Checks out SureA11y/core at the tag of the version npm serves as latest, into
  ./core, and installs its dependencies. W3C reads a report as a claim about a
  published version, so everything here runs from a release, never from core's
  main, whose src moves on as soon as a release is out.

outputs:
  version:
    description: The engine version checked out, as npm serves it.
    value: ${{ steps.engine.outputs.version }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: SureA11y/core
        path: core
        fetch-depth: 0

    - name: Check out the released engine
      id: engine
      shell: bash
      working-directory: core
      run: |
        VERSION="$(npm view @surea11y/core dist-tags.latest)"
        if ! git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" >/dev/null; then
          echo "::error::npm serves $VERSION as latest, but core has no v$VERSION tag"
          exit 1
        fi
        git checkout --detach "v$VERSION"
        if [ "$(node -p "require('./package.json').version")" != "$VERSION" ]; then
          echo "::error::package.json at v$VERSION does not say $VERSION"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: npm
        cache-dependency-path: core/package-lock.json

    - name: Install the engine's dependencies
      shell: bash
      working-directory: core
      run: npm ci
